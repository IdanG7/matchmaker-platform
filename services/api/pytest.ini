[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Without this, pytest-asyncio runs in strict mode and quietly skips every
# async test that lacks an explicit marker - reported as "skipped", not as a
# failure. Most of this suite was in that state and had never actually run.
asyncio_mode = auto

# asyncpg binds connections to the loop that created them, so fixtures have to
# share the per-test loop. See the note in tests/conftest.py.
asyncio_default_fixture_loop_scope = function
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
