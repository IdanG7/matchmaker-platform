services:
  # Infrastructure
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    # -m 8222 enables the HTTP monitoring endpoint the healthcheck probes.
    # Without it nothing listens on 8222 and the check can never pass.
    command: ["--jetstream", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Observability
  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP HTTP
      - "14250:14250"  # gRPC

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ../../ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../ops/grafana-dashboards:/etc/grafana/provisioning/dashboards

  # Application Services
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      # Without this the API hands out mock endpoints nothing listens on.
      GAME_SERVER_AGENT_URL: http://game-agent:8090
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../../services/api:/app

  # Owns the game server binary and its port range. Lives in the game
  # repository, so its build context points outside this one; override
  # GAME_REPO_PATH if your checkout is somewhere else.
  #
  # Behind a profile because that checkout is not always present: the platform
  # has to come up on its own for CI and for anyone working on it without the
  # game. Start it with `docker compose --profile game up` (or `make up-game`),
  # otherwise the API allocates mock servers and says so in the logs.
  game-agent:
    profiles: ["game"]
    build:
      context: ${GAME_REPO_PATH:-../../../../MP-SDK-Game}
      dockerfile: agent/Dockerfile
    environment:
      # What clients are told to dial. Must be reachable from the player's
      # machine, so it cannot be the container name.
      PUBLIC_HOST: ${GAME_PUBLIC_HOST:-localhost}
      MATCHMAKER_URL: http://api:8080
      AGENT_PORT_RANGE_START: 9100
      AGENT_PORT_RANGE_END: 9110
    ports:
      - "8090:8090"
      - "9100-9110:9100-9110"
    restart: unless-stopped

  matchmaker:
    build:
      context: ../../services/matchmaker
      dockerfile: Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      MM_MMR_BAND_INITIAL: ${MM_MMR_BAND_INITIAL:-100}
      MM_MMR_BAND_MAX: ${MM_MMR_BAND_MAX:-500}
      MM_MMR_BAND_GROWTH_PER_SECOND: ${MM_MMR_BAND_GROWTH_PER_SECOND:-10}
      MM_MAX_WAIT_TIME_SECONDS: ${MM_MAX_WAIT_TIME_SECONDS:-120}
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
