# Production overlay for a single VPS.
#
#   docker compose \
#     -f deployments/docker/docker-compose.yml \
#     -f deployments/vps/docker-compose.prod.yml \
#     --profile game up -d
#
# Differences from the development stack:
#   - only the two services the proxy talks to publish a host port at all
#   - the observability stack is not exposed publicly
#   - everything restarts unless explicitly stopped
#   - the agent hands out wss:// URLs routed through the proxy
#
# Nothing here publishes a port it does not need. Compose puts every service on
# one network where they reach each other by name, so postgres, redis, NATS and
# the observability stack need no host binding -- publishing them on 127.0.0.1
# bought nothing and cost a guaranteed collision on any box already running a
# database or a dashboard on the usual port. A published port is also not
# optional: if something else holds it, the container fails to start.
#
# To reach one for administration, forward it over SSH rather than publishing
# it, e.g. `ssh -L 3000:localhost:3000 box` after adding a temporary binding,
# or go through the container: `docker compose exec postgres psql -U multiplayer`.
#
# Env lives in deployments/docker/.env, same as development. See DEPLOY.md.

services:
  postgres:
    ports: !override []
    restart: unless-stopped

  redis:
    ports: !override []
    restart: unless-stopped

  nats:
    ports: !override []
    restart: unless-stopped

  api:
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      # The browser client is served from the demo's own origin, so that is
      # the only origin allowed. The app refuses to start with "*" outside
      # development, which is deliberate.
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN must be set}
      ENVIRONMENT: production
    restart: unless-stopped
    # The source bind-mount is a development convenience; in production the
    # image's own copy is used.
    volumes: !override []

  matchmaker:
    restart: unless-stopped

  game-agent:
    ports: !override
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:9100-9110:9100-9110"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST must be set}
      # Routed by path through the proxy, because per-match ports cannot each
      # have their own certificate. Must match the port range the proxy allows
      # through -- the matcher in the Caddyfile, or the location regex in
      # nginx-demo.conf.
      PUBLIC_URL_TEMPLATE: wss://${PUBLIC_HOST}/gs/{port}
      MATCHMAKER_URL: http://api:8080
    restart: unless-stopped

  # Dashboards are useful but have no business being public on a demo box, and
  # 3000 in particular is the first port anything else on the host will take.
  grafana:
    ports: !override []
    restart: unless-stopped

  prometheus:
    ports: !override []
    restart: unless-stopped

  jaeger:
    ports: !override []
    restart: unless-stopped
