# Reverse proxy for the hosted demo, for a box already running nginx.
#
# Use this instead of the Caddyfile when the host already serves something on
# 80/443. Two web servers cannot share those ports, and taking them from an
# existing site to stand up a demo is the wrong trade.
#
# Install:
#   sudo cp deployments/vps/nginx-demo.conf /etc/nginx/sites-available/zone-control
#   sudo ln -s /etc/nginx/sites-available/zone-control /etc/nginx/sites-enabled/
#   # replace demo.example.com below with the real hostname first
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d demo.example.com
#
# certbot rewrites this file in place to add the listen 443 / ssl_certificate
# lines and an http->https redirect, which is why only port 80 is configured
# here. Run it after the A record resolves, or issuance fails the HTTP-01
# challenge.

server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com;

    # The client streams a multi-megabyte .wasm; gzip earns its keep here.
    # text/html is deliberately absent: nginx always compresses it, and listing
    # it again is a "duplicate MIME type" warning on every config test.
    gzip on;
    gzip_types application/javascript application/wasm text/css application/json;
    gzip_min_length 1024;

    # Per-match game servers, one path segment per allocated port: /gs/9100
    # reaches the server on port 9100. Per-match ports cannot each hold their
    # own certificate, so they are routed by path behind this one instead.
    #
    # The range in the regex is the agent's allocation range and nothing more.
    # Without that bound this location would proxy to any port on the host,
    # including the ones deliberately bound to localhost.
    location ~ ^/gs/(910[0-9]|9110)$ {
        proxy_pass http://127.0.0.1:$1;

        # WebSocket upgrade. nginx does not do this by default the way Caddy
        # does, and without it the handshake returns 200 and the client sits
        # waiting for a socket that never opens.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A match runs for three minutes and a spectating socket can be idle
        # for most of it. The default 60s read timeout would drop it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Matchmaker API, including the party WebSocket at /v1/ws/*.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # The WASM client and its assets. `make wasm` in the game repository
    # writes these to its web/ directory; copy or symlink that here.
    root /srv/zone-control/web;
    index game_client.html;

    location / {
        try_files $uri $uri/ /game_client.html;
    }

    # Browsers refuse to stream-compile a module served as anything else, and
    # nginx's default mime.types has no entry for it.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=3600";
    }
}
