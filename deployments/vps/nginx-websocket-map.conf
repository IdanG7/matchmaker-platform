# WebSocket upgrade map, required by nginx-demo.conf.
#
# $connection_upgrade has to resolve to "upgrade" for a WebSocket handshake and
# "close" for anything else. A map can only be declared in the http context, so
# it cannot live inside the server block that uses it -- nginx fails to start
# with "unknown variable connection_upgrade" if this file is missing.
#
# Install:
#   sudo cp deployments/vps/nginx-websocket-map.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Harmless if another site already defines the same map under a different name;
# only a second map assigning THIS name would conflict.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
